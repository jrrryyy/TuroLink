      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Student Submitted Files</text>
      <text x="93" y="74" text-anchor="middle" fill="#64748b" font-size="9">Fast CDN Media Delivery</text>
