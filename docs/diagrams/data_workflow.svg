      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Scheduled Cron Checks</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Deadline Expirations</text>
