      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Normalized Percentages</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Subject-level Competency</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(14, 329)">
      <rect width="187" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="93" y="24" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700">Governance &amp; Risk Stats</text>
      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Dispute Turnaround Time</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Pending vs Resolved Ratios</text>
      <text x="93" y="74" text-anchor="middle" fill="#64748b" font-size="9">Ban &amp; Suspension Counts</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
