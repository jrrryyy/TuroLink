    <rect width="180" height="32" rx="8" x="17" y="16" fill="#0284c7" />
    <text x="107" y="37" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">1. INGESTION</text>

    <!-- Step 1 -->
    <g transform="translate(14, 68)">
      <rect width="187" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="93" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">User Interactions</text>
      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Lesson Bookings</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Student &amp; Tutor Portals</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(14, 155)">
      <rect width="187" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="93" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Student Coursework</text>
      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Assignments &amp; Quizzes</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">File Attachments &amp; Notes</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(14, 242)">
      <rect width="187" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="93" y="24" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Community Grievances</text>
      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Moderation Reports</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Fraud, Scam, Harassment</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(14, 329)">
