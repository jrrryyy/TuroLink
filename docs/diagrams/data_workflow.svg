      <text x="88" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10">Proportional Bar Charts</text>
      <text x="88" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Custom Coordinate Engine</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(12, 155)">
      <rect width="176" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="88" y="24" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700">Bézier Trend Curves</text>
      <text x="88" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10">Smooth Cubic Splines</text>
      <text x="88" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Longitudinal Trajectory</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(12, 242)">
      <rect width="176" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="88" y="24" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700">Interactive Tooltips</text>
      <text x="88" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10">Hover Coordinate Hotspots</text>
      <text x="88" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Exact Hours &amp; Sessions</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(12, 329)">
      <rect width="176" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="88" y="24" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700">KPI Dashboards &amp; Badges</text>
      <text x="88" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10">Summary Stat Tiles</text>
      <text x="88" y="58" text-anchor="middle" fill="#94a3b8" font-size="9">Admin Moderation Panels</text>
      <text x="88" y="74" text-anchor="middle" fill="#64748b" font-size="8.5">Real-Time Operational Center</text>
    </g>
  </g>
</svg>
