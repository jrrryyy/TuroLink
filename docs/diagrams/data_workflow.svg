      <text x="93" y="24" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">Conflict Detection</text>
      <text x="93" y="42" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Double-Booking Guard</text>
      <text x="93" y="58" text-anchor="middle" fill="#94a3b8" font-size="9.5">Prevent Duplicate Turn-In</text>
